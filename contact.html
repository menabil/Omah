<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – Omah</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS compiled -->
    <link href="./src/output.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  </head>
  <body class="font-pop bg-[#EEEDDE]">
    <!-- Navbar (reuse same structure as other pages) -->
    <header class="md:py-12.5 py-5 bg-[#EEEDDE]">
      <div class="flex justify-between container md:px-0 px-4">
        <img src="images/logo.png" alt="Omah Logo" class="cursor-pointer" />
        <i class="fa-solid fa-bars md:hidden"></i>
        <ul class="hidden md:flex gap-x-8">
          <li class="hover:border-b-4 duration-300 hover:border-[#F6762E] border-b-4 border-transparent cursor-pointer text-base hover:font-semibold"><a href="index.html" class="block py-2">Home</a></li>
          <li class="hover:border-b-4 duration-300 hover:border-[#F6762E] border-b-4 border-transparent cursor-pointer text-base hover:font-semibold"><a href="about.html" class="block py-2">About</a></li>
          <li class="hover:border-b-4 duration-300 hover:border-[#F6762E] border-b-4 border-transparent cursor-pointer text-base hover:font-semibold"><a href="properties.html" class="block py-2">Properties</a></li>
          <li class="hover:border-b-4 duration-200 hover:border-[#F6762E] border-b-4 border-transparent cursor-pointer text-base hover:font-semibold"><a href="contact.html" class="block py-2">Contact</a></li>
        </ul>
      </div>
    </header>

    <!-- Contact Section -->
    <section class="py-12 md:py-20 container mx-auto">
      <h1 class="text-4xl md:text-5xl font-semibold text-center text-[#203239] mb-10">Contact Us</h1>
      <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-cShadow p-8">
        <form>
          <div class="mb-4">
            <label class="block text-sm font-medium text-[#203239]/80 mb-1" for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#FF7527]" />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-[#203239]/80 mb-1" for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#FF7527]" />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-[#203239]/80 mb-1" for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Your message" class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-[#FF7527]"></textarea>
          </div>
          <button type="submit" class="w-full bg-[#FF7527] text-white py-3 rounded-md hover:bg-[#e66b23] transition">Send Message</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 bg-[#203239] text-white text-center">
      <p class="text-sm">© 2026 Omah. All rights reserved.</p>
    </footer>
  </body>
</html>
